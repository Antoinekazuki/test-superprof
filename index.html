<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World · SEI Formation</title>
  <style>
    :root { --ink: #14213d; --muted: #5c6b80; --line: #e3e7ee; --accent: #2a5bd7; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: #ffffff; color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    main { text-align: center; max-width: 560px; }
    .logo { height: 72px; margin-bottom: 32px; }
    .wordmark { font-size: 20px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 32px; }
    h1 { font-size: clamp(40px, 9vw, 72px); line-height: 1.05; letter-spacing: -.02em; }
    p { margin-top: 16px; font-size: 17px; line-height: 1.5; color: var(--muted); }
    footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="SEI Formation"
         onerror="this.outerHTML='<div class=&quot;wordmark&quot;>SEI Formation</div>'">
    <h1>Hello World</h1>
    <p>Cette page est publiée par GitHub Pages, à partir d'un simple fichier <code>index.html</code> déposé dans un dépôt GitHub.</p>
    <footer>Démo · SEI Formation · Antoine Bousquet</footer>
  </main>
</body>
</html>
